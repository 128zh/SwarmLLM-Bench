version: 2

# Dependabot automatically opens PRs to keep dependencies current,
# including patching dependencies with known vulnerabilities.

updates:
  # Python dependencies (requirements.txt).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies

  # GitHub Actions used by the workflows above.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
